downstream_selection_rule: >-
  Best reference by max(min(strict accuracy,tolerant accuracy)), then lower
  mean generated tokens, then fixed reference arm ID; D_select only.
quality_constraint_for_internal_validation: >-
  Exploratory request-cost benefit is not quality preservation. Report both
  paired accuracy CIs; quality evidence is INCONCLUSIVE unless both lower
  bounds exceed a prospectively frozen noninferiority margin. No default
  2pp noninferiority claim is authorized by this protocol.
