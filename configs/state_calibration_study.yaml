tolerance_rationale: >-
  Predeclared study-specific bounds on the dimensionless relative joint
  mean/std RMS discrepancy E_moment: 0.05 for held-out native matching and
  0.01 for additional state-source error. These are engineering choices, not
  a norm-ratio band or a field consensus. Implementation noise is measured
  separately before use. No NEGATIVE or matching claim if noise is material
  relative to these bounds; report continuous effect intervals instead.
